[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oci-database-observatory"
version = "0.1.0"
description = "Multi-agent framework for Oracle, MySQL, and PostgreSQL observability on OCI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Adrian Birzu" }
]
dependencies = [
    # Core Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",

    # MCP SDK
    "mcp>=1.0.0",

    # OCI SDK
    "oci>=2.135.0",

    # OpenTelemetry (OCI APM)
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",

    # HTTP & Async
    "httpx>=0.27.0",
    "aiohttp>=3.11.0",

    # Caching
    "redis>=5.2.0",

    # Logging
    "structlog>=24.4.0",

    # Utilities
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
slack = [
    "slack-bolt>=1.21.0",
]
teams = [
    "botbuilder-core>=4.16.0",
]

[project.scripts]
observatory = "src.main:main"
observatory-dev = "src.main:dev"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
